services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Host 5433: tránh đụng PostgreSQL Windows cài sẵn (thường chiếm 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Schema: API EF migrate. Data demo: .\deploy\clear-and-seed.ps1 (sql/clear_and_seed.sql)
      # Không mount init SQL — file seed cũ đã gỡ; Docker bind file thiếu sẽ tạo thư mục và postgres không lên.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  # Optional: docker compose -f deploy/docker-compose.yml --profile api up -d --build
  # Local `dotnet run` vẫn dùng được song song (infra only: up -d không có --profile api).
  api:
    profiles: ["api"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "5080:8080"
    env_file:
      - ../.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Override host .env (localhost) → tên service trong Docker network
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=postgres;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://guest:guest@rabbitmq:5672
      # Seed banner/docs/certs dùng absolute R2 URL; PublicBaseUrl chỉ cho upload mới.
      Storage__PublicBaseUrl: https://pub-36bb0ea536ef493b9c291b1bf1ec2e20.r2.dev
      Frontend__AdminAppUrl: http://localhost:3001
      Frontend__UserAppUrl: http://localhost:3000/login
      PayOS__PublicApiBaseUrl: http://localhost:5080
      PayOS__LinkTtlMinutes: "15"
      # OCR service chạy trên host (:8089). Windows/Mac Docker → host.docker.internal
      Photo__Ocr__BaseUrl: http://host.docker.internal:8089
      Photo__Ocr__ServiceKey: dev-ocr-key-change-me
      Photo__Ocr__ThresholdAuto: "0.85"
      Photo__Ocr__ThresholdReviewMin: "0.50"
      # Khớp OCR MAX_INFLIGHT=3 (overlap YOLO CUDA + Paddle CPU).
      Photo__Ocr__WorkerMaxParallel: "3"
      Photo__Ocr__WorkerIdleDelaySeconds: "5"
      # 0 = không sleep giữa wave OCR
      Photo__Ocr__WorkerBusyDelaySeconds: "0"
      # Organizer race simulation demo (REST + SignalR hub)
      Simulation__Enabled: "true"
      Simulation__StartTimeZone: "UTC"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

volumes:
  pgdata:
