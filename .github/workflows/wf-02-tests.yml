name: WF-02 Backend Tests

on:
  push:
    branches: [volunteer-api]
  pull_request:
    branches: [volunteer-api, main]

permissions:
  contents: read

concurrency:
  group: wf-02-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [Event, RaceMonitoring]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore test dependencies
        run: dotnet restore tests/RaceDay.Modules.${{ matrix.suite }}.UnitTests/RaceDay.Modules.${{ matrix.suite }}.UnitTests.csproj

      - name: Run tests
        run: >-
          dotnet test tests/RaceDay.Modules.${{ matrix.suite }}.UnitTests/RaceDay.Modules.${{ matrix.suite }}.UnitTests.csproj
          --configuration Release --no-restore
          --logger "trx;LogFileName=${{ matrix.suite }}.trx"
          --results-directory TestResults/${{ matrix.suite }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wf-02-${{ matrix.suite }}-results
          path: TestResults/${{ matrix.suite }}/*.trx
          if-no-files-found: warn
          retention-days: 14
